<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>잠김 · 갓생살기종합세트</title>
  <!-- 147차: 앱과 같은 Ledger 포스터(ledger.css). 데스크탑 차단 화면(BlockScreen)과 같은 구성 — "진행"은 장식용, 나가는 건 "중단"뿐. -->
  <link rel="stylesheet" href="ledger.css" />
</head>
<body>
  <main class="poster">
    <p class="overline">갓생살기종합세트</p>
    <div class="grow"></div>
    <p class="overline">잠김</p>
    <h1 id="title"></h1>
    <p class="message" id="message"></p>
    <div class="grow"></div>
    <div class="buttons">
      <button class="outline" id="yes">진행</button>
      <button class="filled" id="no">중단</button>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <script src="quotes.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
