<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>실행 확인 · 갓생살기종합세트</title>
  <!-- 147차: 가운데 정렬 안내문 → 앱과 같은 Ledger 포스터(ledger.css). 데스크탑 실행 확인(ConfirmScreen)과 같은 구성. -->
  <link rel="stylesheet" href="ledger.css" />
</head>
<body>
  <main class="poster">
    <p class="overline">갓생살기종합세트</p>
    <div class="grow"></div>
    <p class="overline" id="kicker">실행 확인</p>
    <h1 id="title"></h1>
    <p class="message" id="message"></p>
    <div class="countdown" id="countdown">
      <div class="big"><span id="count">0</span><span class="unit">초</span></div>
      <div class="progress"><i id="bar"></i></div>
    </div>
    <p class="hint" id="hint"></p>
    <div class="grow"></div>
    <div class="buttons">
      <button class="outline" id="yes"></button>
      <button class="filled" id="no">중단</button>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <script src="quotes.js"></script>
  <script src="confirm.js"></script>
</body>
</html>
