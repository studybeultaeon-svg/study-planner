<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>설치 완료 · 갓생살기종합세트 사이트 차단</title>
  <!-- 147차: 카드·노란 상자 → 앱과 같은 Ledger 안내(작은 라벨 + 큰 제목 + 가는 선, 경고는 왼쪽 막대 한 줄). -->
  <link rel="stylesheet" href="ledger.css" />
</head>
<body>
  <main class="poster">
    <p class="overline">갓생살기종합세트 사이트 차단</p>
    <h1>설치 완료</h1>
    <p class="message">등록한 사이트를 지금부터 차단합니다. 한 가지만 알아 두세요.</p>
    <div class="section">
      <div class="notice">
        <strong>시크릿(InPrivate) 창에서는 확장이 기본으로 꺼져 있습니다.</strong>
        <p>크롬 정책상 확장은 스스로 시크릿 권한을 켤 수 없어, 직접 허용하지 않으면 시크릿 창에서는 차단되지 않습니다.</p>
      </div>
    </div>
    <div class="section">
      <p class="overline">시크릿 창에서도 차단하려면</p>
      <ol>
        <li>아래 버튼으로 확장 상세 설정을 엽니다.</li>
        <li>"시크릿 모드에서 허용"을 켭니다.</li>
      </ol>
    </div>
    <div class="grow"></div>
    <div class="buttons">
      <button class="filled" id="openSettings">확장 설정 열기</button>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
